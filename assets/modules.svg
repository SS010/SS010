<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><style>
.mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace}
.card{fill:#0d1117;stroke:#00ff41;stroke-opacity:.35;stroke-width:1.2;animation:pulse 3s ease-in-out infinite}
