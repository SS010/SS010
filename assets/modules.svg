.bar{fill:#00ff41;animation:bp 3s ease-in-out infinite}@keyframes bp{50%{opacity:.35}}
.nm{font-size:17px;font-weight:700;fill:#00ff41}.ds{font-size:14px;fill:#8b949e}.st{font-size:12px;fill:#c9ffd6;letter-spacing:1px}.id{font-size:12px;fill:#00ff41;fill-opacity:.5}
.dot{fill:#00ff41;animation:bl 1.4s steps(1) infinite}@keyframes bl{50%{opacity:.2}}
</style><g transform="translate(20,20)"><rect class="card" style="animation-delay:0.0s" width="280" height="92" rx="8"/>
