<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30"><style>
.mono{font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;fill:#00ff41}
.tr{animation:tr 3.2s linear infinite}@keyframes tr{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
.dm{animation:bk 1.2s steps(1) infinite}@keyframes bk{50%{opacity:.2}}
</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset="1" stop-color="#7dff9b"/></linearGradient>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".15" stop-color="#00ff41" stop-opacity=".35"/><stop offset=".85" stop-color="#00ff41" stop-opacity=".35"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="14" width="900" height="2" fill="url(#e)"/>
<rect class="tr" x="0" y="13" width="160" height="4" rx="2" fill="url(#g)"/>
<rect x="430" y="6" width="40" height="18" fill="#0d1117"/>
<text class="mono dm" x="450" y="19" text-anchor="middle">◢◤◢◤</text>
<text class="mono" x="40" y="10" fill-opacity=".5">//</text><text class="mono" x="860" y="10" text-anchor="end" fill-opacity=".5">//</text></svg>